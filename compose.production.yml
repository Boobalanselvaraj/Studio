name: photo-studio-platform
include:
  - compose/data.yml
  - compose/media.yml
services:
  api:
    build:
      context: .
      dockerfile: docker/api.production.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-photo_studio_db}
      REDIS_HOST: redis
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      SFTPGO_HOST: http://sftpgo:8080
      STORAGE_ROOT_PATH: /storage
      IMMICH_URL: http://immich-server:2283
    volumes:
      - ./storage:/storage
    networks: [studio_internal_network]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build:
      context: .
      dockerfile: docker/web.production.Dockerfile
    restart: unless-stopped
    networks: [studio_internal_network]
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:8088:80"]
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    networks: [studio_internal_network]
    depends_on: [api, web]
networks:
  studio_internal_network:
    name: studio_internal_network
