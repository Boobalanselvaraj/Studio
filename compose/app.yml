services:
  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    command: sh -c "npx prisma generate --schema=prisma/schema.prisma && node src/server.js"
    working_dir: /usr/src/app
    container_name: studio_api
    restart: unless-stopped
    ports:
      - "${PORT:-4000}:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SFTPGO_HOST: http://sftpgo:8080
      SFTPGO_ADMIN_USER: ${SFTPGO_ADMIN_USER:-admin}
      SFTPGO_ADMIN_PASSWORD: ${SFTPGO_ADMIN_PASSWORD:-password123}
      INTERNAL_SERVICE_KEY: ${INTERNAL_SERVICE_KEY}
      STORAGE_ROOT_PATH: /storage
      IMMICH_URL: http://immich-server:2283
      IMMICH_API_KEY: ${IMMICH_API_KEY:-}
      PORT: 4000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres_secure_password}@postgres:5432/${DB_NAME:-photo_studio_db}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672
      SESSION_SECRET: ${SESSION_SECRET}
      JWT_SECRET: ${JWT_SECRET}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
    volumes:
      - ../storage:/storage
      - ../apps/api:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - studio_internal_network

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    working_dir: /usr/src/app
    container_name: studio_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      VITE_API_BASE_URL: /api
      API_PROXY_TARGET: http://api:4000
    volumes:
      - ../apps/web:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - studio_internal_network

  nginx:
    image: nginx:1.25-alpine
    container_name: studio_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
      - web
    networks:
      - studio_internal_network



