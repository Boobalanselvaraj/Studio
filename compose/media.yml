services:
  sftpgo:
    image: drakkan/sftpgo:v2.6-alpine
    container_name: studio_sftpgo
    restart: unless-stopped
    ports:
      - "${SFTPGO_PORT:-2022}:2022"
      - "127.0.0.1:${SFTPGO_ADMIN_PORT:-8080}:8080"
    environment:
      SFTPGO_DATA_PROVIDER__DRIVER: sqlite
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: 'true'
      SFTPGO_HTTPD__BINDINGS__0__PORT: 8080
      SFTPGO_SFTPD__BINDINGS__0__PORT: 2022
      SFTPGO_DEFAULT_ADMIN_USERNAME: ${SFTPGO_ADMIN_USER:-admin}
      SFTPGO_DEFAULT_ADMIN_PASSWORD: ${SFTPGO_ADMIN_PASSWORD:?Set SFTPGO_ADMIN_PASSWORD}
    volumes:
      - sftpgo_data:/var/lib/sftpgo
      - ../storage/studios:/srv/sftpgo/data
    networks:
      - studio_internal_network

  immich-server:
    image: ghcr.io/immich-app/immich-server:release
    container_name: studio_immich_server
    restart: unless-stopped
    ports:
      - "${IMMICH_PORT:-2283}:2283"
    environment:
      DB_HOSTNAME: postgres
      DB_USERNAME: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres_secure_password}
      DB_DATABASE_NAME: immich
      REDIS_HOSTNAME: redis
    volumes:
      - immich_upload:/usr/src/app/upload
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - studio_internal_network

  piwigo:
    image: linuxserver/piwigo:latest
    container_name: studio_piwigo_eval
    profiles:
      - evaluation
    restart: unless-stopped
    ports:
      - "8085:80"
    volumes:
      - piwigo_config:/config
      - piwigo_gallery:/gallery
    networks:
      - studio_internal_network

volumes:
  sftpgo_data:
  immich_upload:
  piwigo_config:
  piwigo_gallery:


